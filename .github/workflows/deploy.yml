name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Target deploy"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - all
          - backend
          - admin
          - customer
          - driver

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PHP_VERSION: "8.3"
  PNPM_VERSION: "10.33.2"
  API_URL: "https://aplikasijoker.my.id/api"
  BACKEND_PATH: "/home/aplikasijoker.my.id/laravel"
  BACKEND_PUBLIC_PATH: "/home/aplikasijoker.my.id/public_html"
  ADMIN_PUBLIC_PATH: "/home/admin.aplikasijoker.my.id/public_html"
  CUSTOMER_PUBLIC_PATH: "/home/app.aplikasijoker.my.id/public_html"
  DRIVER_PUBLIC_PATH: "/home/driver.aplikasijoker.my.id/public_html"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect deploy scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          target="${{ github.event.inputs.target || 'auto' }}"
          backend=false
          admin=false
          customer=false
          driver=false

          mark_all() {
            backend=true
            admin=true
            customer=true
            driver=true
          }

          case "$target" in
            all)
              mark_all
              ;;
            backend)
              backend=true
              ;;
            admin)
              admin=true
              ;;
            customer)
              customer=true
              ;;
            driver)
              driver=true
              ;;
            auto)
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                mark_all
              else
                before="${{ github.event.before }}"
                after="${{ github.sha }}"
                if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
                  files="$(git diff --name-only HEAD~1 HEAD || true)"
                else
                  git fetch --no-tags --depth=2 origin "${{ github.ref_name }}" >/dev/null 2>&1 || true
                  files="$(git diff --name-only "$before" "$after" || true)"
                fi

                if [ -z "$files" ]; then
                  files="$(git diff --name-only HEAD~1 HEAD || true)"
                fi

                echo "Changed files:"
                echo "$files"

                while IFS= read -r file; do
                  [ -z "$file" ] && continue
                  case "$file" in
                    backend/*)
                      backend=true
                      ;;
                    apps/admin/*)
                      admin=true
                      ;;
                    apps/customer/*)
                      customer=true
                      ;;
                    apps/driver/*)
                      driver=true
                      ;;
                    packages/*|pnpm-lock.yaml|pnpm-workspace.yaml|package.json|scripts/write-build-version.mjs)
                      admin=true
                      customer=true
                      driver=true
                      ;;
                    .github/workflows/deploy.yml)
                      mark_all
                      ;;
                  esac
                done <<< "$files"
              fi
              ;;
            *)
              echo "Unknown target: $target" >&2
              exit 1
              ;;
          esac

          frontend=false
          if [ "$admin" = true ] || [ "$customer" = true ] || [ "$driver" = true ]; then
            frontend=true
          fi

          any=false
          if [ "$backend" = true ] || [ "$frontend" = true ]; then
            any=true
          fi

          {
            echo "backend=$backend"
            echo "admin=$admin"
            echo "customer=$customer"
            echo "driver=$driver"
            echo "frontend=$frontend"
            echo "any=$any"
          } >> "$GITHUB_OUTPUT"

          echo "Deploy scope: backend=$backend admin=$admin customer=$customer driver=$driver"

      - name: Setup pnpm
        if: steps.scope.outputs.frontend == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: steps.scope.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install frontend dependencies
        if: steps.scope.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile

      - name: Create production frontend env files
        if: steps.scope.outputs.frontend == 'true'
        shell: bash
        run: |
          apps=()
          if [ "${{ steps.scope.outputs.admin }}" = "true" ]; then apps+=(admin); fi
          if [ "${{ steps.scope.outputs.customer }}" = "true" ]; then apps+=(customer); fi
          if [ "${{ steps.scope.outputs.driver }}" = "true" ]; then apps+=(driver); fi
          for app in "${apps[@]}"; do
            printf "VITE_API_URL=%s\nVITE_API_BASE_URL=%s\n" "${API_URL}" "${API_URL}" > "apps/${app}/.env.production"
          done

      - name: Build admin frontend
        if: steps.scope.outputs.admin == 'true'
        run: pnpm --filter admin build

      - name: Build customer frontend
        if: steps.scope.outputs.customer == 'true'
        run: pnpm --filter customer build

      - name: Build driver frontend
        if: steps.scope.outputs.driver == 'true'
        run: pnpm --filter driver build

      - name: Setup PHP for backend dependency validation
        if: steps.scope.outputs.backend == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, mbstring, openssl, pdo, tokenizer, xml
          coverage: none

      - name: Prepare Laravel runtime directories
        if: steps.scope.outputs.backend == 'true'
        shell: bash
        run: |
          mkdir -p backend/bootstrap/cache
          mkdir -p backend/storage/framework/cache/data
          mkdir -p backend/storage/framework/sessions
          mkdir -p backend/storage/framework/testing
          mkdir -p backend/storage/framework/views
          mkdir -p backend/storage/logs

      - name: Validate backend composer dependencies
        if: steps.scope.outputs.backend == 'true'
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Setup SSH agent
        if: steps.scope.outputs.any == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        if: steps.scope.outputs.any == 'true'
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote directories exist
        if: steps.scope.outputs.any == 'true'
        shell: bash
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p '${BACKEND_PATH}' '${BACKEND_PUBLIC_PATH}' '${ADMIN_PUBLIC_PATH}' '${CUSTOMER_PUBLIC_PATH}' '${DRIVER_PUBLIC_PATH}'"

      - name: Upload backend source
        if: steps.scope.outputs.backend == 'true'
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            --exclude='.env' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/app/public/' \
            --exclude='storage/framework/cache/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/testing/' \
            --exclude='storage/framework/views/' \
            --exclude='storage/logs/' \
            backend/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${BACKEND_PATH}/"

      - name: Upload Laravel public assets
        if: steps.scope.outputs.backend == 'true'
        shell: bash
        run: |
          rsync -az \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            --exclude='index.php' \
            --exclude='.htaccess' \
            --exclude='storage/' \
            backend/public/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${BACKEND_PUBLIC_PATH}/"

      - name: Upload admin frontend
        if: steps.scope.outputs.admin == 'true'
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            --exclude='error_log' \
            apps/admin/dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${ADMIN_PUBLIC_PATH}/"

      - name: Upload customer frontend
        if: steps.scope.outputs.customer == 'true'
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            --exclude='error_log' \
            apps/customer/dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${CUSTOMER_PUBLIC_PATH}/"

      - name: Upload driver frontend
        if: steps.scope.outputs.driver == 'true'
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            --exclude='error_log' \
            apps/driver/dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${DRIVER_PUBLIC_PATH}/"

      - name: Finalize Laravel deployment
        if: steps.scope.outputs.backend == 'true'
        shell: bash
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "set -e; \
            cd '${BACKEND_PATH}'; \
            mkdir -p bootstrap/cache storage/app/livewire-tmp storage/app/public/settings/payment storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs; \
            rm -f bootstrap/cache/*.php; \
            composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader; \
            php artisan package:discover --ansi; \
            php artisan optimize:clear; \
            php artisan storage:link || true; \
            php artisan migrate --force; \
            php artisan db:seed --class=RolePermissionSeeder --force; \
            WEBUSER=\$(ps -eo user:30,comm,args | awk '/lsphp/ && !/awk/ {print \$1; exit}'); \
            if [ -z \"\$WEBUSER\" ] && id aplik7393 >/dev/null 2>&1; then WEBUSER=aplik7393; fi; \
            if [ -n \"\$WEBUSER\" ]; then WEBGROUP=\$(id -gn \"\$WEBUSER\"); chown -R \"\$WEBUSER:\$WEBGROUP\" storage bootstrap/cache; fi; \
            find storage bootstrap/cache -type d -exec chmod 775 {} \; ; \
            find storage bootstrap/cache -type f -exec chmod 664 {} \; ; \
            php artisan config:cache; \
            php artisan route:cache; \
            php artisan view:cache; \
            if [ -n \"\$WEBUSER\" ]; then WEBGROUP=\$(id -gn \"\$WEBUSER\"); chown -R \"\$WEBUSER:\$WEBGROUP\" storage bootstrap/cache; fi; \
            find storage bootstrap/cache -type d -exec chmod 775 {} \; ; \
            find storage bootstrap/cache -type f -exec chmod 664 {} \; "

      - name: Nothing to deploy
        if: steps.scope.outputs.any != 'true'
        run: echo "No frontend or backend deployment needed for this change."
