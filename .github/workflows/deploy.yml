name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Target deploy"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - all
          - backend
          - admin
          - customer
          - driver

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PHP_VERSION: "8.3"
  PNPM_VERSION: "10.33.2"
  API_URL: "https://aplikasijoker.my.id/api"
  BACKEND_PATH: "/home/aplikasijoker.my.id/laravel"
  BACKEND_PUBLIC_PATH: "/home/aplikasijoker.my.id/public_html"
  ADMIN_PUBLIC_PATH: "/home/admin.aplikasijoker.my.id/public_html"
  CUSTOMER_PUBLIC_PATH: "/home/app.aplikasijoker.my.id/public_html"
  DRIVER_PUBLIC_PATH: "/home/driver.aplikasijoker.my.id/public_html"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect deploy scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          target="${{ github.event.inputs.target || 'auto' }}"
          backend=false
          admin=false
          customer=false
          driver=false

          mark_all() {
            backend=true
            admin=true
            customer=true
            driver=true
          }

          case "$target" in
            all)
              mark_all
              ;;
            backend)
              backend=true
              ;;
            admin)
              admin=true
              ;;
            customer)
              customer=true
              ;;
            driver)
              driver=true
              ;;
            auto)
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                mark_all
              else
                before="${{ github.event.before }}"
                after="${{ github.sha }}"
                if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
                  files="$(git diff --name-only HEAD~1 HEAD || true)"
                else
                  git fetch --no-tags --depth=2 origin "${{ github.ref_name }}" >/dev/null 2>&1 || true
                  files="$(git diff --name-only "$before" "$after" || true)"
                fi

                if [ -z "$files" ]; then
                  files="$(git diff --name-only HEAD~1 HEAD || true)"
                fi

                echo "Changed files:"
                echo "$files"

                while IFS= read -r file; do
                  [ -z "$file" ] && continue
                  case "$file" in
                    backend/*)
                      backend=true
                      ;;
                    apps/admin/*)
                      admin=true
                      ;;
                    apps/customer/*)
                      customer=true
                      ;;
                    apps/driver/*)
                      driver=true
                      ;;
                    packages/*|pnpm-lock.yaml|pnpm-workspace.yaml|package.json|scripts/write-build-version.mjs)
                      admin=true
                      customer=true
                      driver=true
                      ;;
                    .github/workflows/deploy.yml)
                      mark_all
                      ;;
                  esac
                done <<< "$files"
              fi
              ;;
            *)
              echo "Unknown target: $target" >&2
              exit 1
              ;;
          esac

          frontend=false
          if [ "$admin" = true ] || [ "$customer" = true ] || [ "$driver" = true ]; then
            frontend=true
          fi

          any=false
          if [ "$backend" = true ] || [ "$frontend" = true ]; then
            any=true
          fi

          {
            echo "backend=$backend"
            echo "admin=$admin"
            echo "customer=$customer"
            echo "driver=$driver"
            echo "frontend=$frontend"
            echo "any=$any"
          } >> "$GITHUB_OUTPUT"

          echo "Deploy scope: backend=$backend admin=$admin customer=$customer driver=$driver"

      - name: Setup pnpm
        if: steps.scope.outputs.frontend == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: steps.scope.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install frontend dependencies
        if: steps.scope.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile

      - name: Create production frontend env files
        if: steps.scope.outputs.frontend == 'true'
        shell: bash
        run: |
          apps=()
          if [ "${{ steps.scope.outputs.admin }}" = "true" ]; then apps+=(admin); fi
          if [ "${{ steps.scope.outputs.customer }}" = "true" ]; then apps+=(customer); fi
          if [ "${{ steps.scope.outputs.driver }}" = "true" ]; then apps+=(driver); fi
          for app in "${apps[@]}"; do
            printf "VITE_API_URL=%s\nVITE_API_BASE_URL=%s\n" "${API_URL}" "${API_URL}" > "apps/${app}/.env.production"
          done

      - name: Build admin frontend
        if: steps.scope.outputs.admin == 'true'
        run: pnpm --filter admin build

      - name: Build customer frontend
        if: steps.scope.outputs.customer == 'true'
        run: pnpm --filter customer build

      - name: Build driver frontend
        if: steps.scope.outputs.driver == 'true'
        run: pnpm --filter driver build

      - name: Setup PHP for backend dependency validation
        if: steps.scope.outputs.backend == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, mbstring, openssl, pdo, tokenizer, xml
          coverage: none

      - name: Prepare Laravel runtime directories
        if: steps.scope.outputs.backend == 'true'
        shell: bash
        run: |
          mkdir -p backend/bootstrap/cache
          mkdir -p backend/storage/framework/cache/data
          mkdir -p backend/storage/framework/sessions
          mkdir -p backend/storage/framework/testing
          mkdir -p backend/storage/framework/views
          mkdir -p backend/storage/logs

      - name: Validate backend composer dependencies
        if: steps.scope.outputs.backend == 'true'
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Setup SSH agent
        if: steps.scope.outputs.any == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        if: steps.scope.outputs.any == 'true'
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote directories exist
        if: steps.scope.outputs.any == 'true'
        shell: bash
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo mkdir -p '${BACKEND_PATH}' '${BACKEND_PUBLIC_PATH}' '${ADMIN_PUBLIC_PATH}' '${CUSTOMER_PUBLIC_PATH}' '${DRIVER_PUBLIC_PATH}'"

      - name: Backup production before deploy
        if: steps.scope.outputs.any == 'true'
        shell: bash
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="/home/aplikasijoker.my.id/laravel"
          BACKEND_PUBLIC="/home/aplikasijoker.my.id/public_html"
          ADMIN="/home/admin.aplikasijoker.my.id/public_html"
          CUSTOMER="/home/app.aplikasijoker.my.id/public_html"
          DRIVER="/home/driver.aplikasijoker.my.id/public_html"
          OUT="$HOME/jojo-deploy-backups/${{ github.sha }}"
          DB_CONFIG="$OUT/.database.cnf"

          mkdir -p "$OUT"
          sudo tar -czf "$OUT/backend-before.tar.gz" -C "$APP" app database resources routes composer.json composer.lock
          sudo tar -czf "$OUT/backend-public-before.tar.gz" -C "$BACKEND_PUBLIC" .
          sudo tar -czf "$OUT/admin-before.tar.gz" -C "$ADMIN" .
          sudo tar -czf "$OUT/customer-before.tar.gz" -C "$CUSTOMER" .
          sudo tar -czf "$OUT/driver-before.tar.gz" -C "$DRIVER" .

          cd "$APP"
          DB_CONFIG="$DB_CONFIG" php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db = config("database.connections.mysql");
          $escape = static fn (string $value): string => str_replace(["\\", "\""], ["\\\\", "\\\""], $value);
          $config = "[client]\n"
              ."host=\"".$escape((string) ($db["host"] ?? "127.0.0.1"))."\"\n"
              ."port=\"".$escape((string) ($db["port"] ?? "3306"))."\"\n"
              ."user=\"".$escape((string) $db["username"])."\"\n"
              ."password=\"".$escape((string) $db["password"])."\"\n";
          file_put_contents(getenv("DB_CONFIG"), $config);
          chmod(getenv("DB_CONFIG"), 0600);
          '
          DATABASE="$(php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo config("database.connections.mysql.database");')"
          mysqldump --defaults-extra-file="$DB_CONFIG" --no-tablespaces --single-transaction --quick --routines --triggers "$DATABASE" | gzip -c > "$OUT/database-before.sql.gz"
          rm -f "$DB_CONFIG"
          echo "Backup production tersimpan di $OUT"
          REMOTE

      - name: Upload backend source
        if: steps.scope.outputs.backend == 'true'
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            --rsync-path="sudo rsync" \
            --exclude='.env' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/app/public/' \
            --exclude='storage/framework/cache/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/testing/' \
            --exclude='storage/framework/views/' \
            --exclude='storage/logs/' \
            backend/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${BACKEND_PATH}/"

      - name: Upload Laravel public assets
        if: steps.scope.outputs.backend == 'true'
        shell: bash
        run: |
          rsync -az \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            --rsync-path="sudo rsync" \
            --exclude='index.php' \
            --exclude='.htaccess' \
            --exclude='storage/' \
            backend/public/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${BACKEND_PUBLIC_PATH}/"

      - name: Upload admin frontend
        if: steps.scope.outputs.admin == 'true'
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            --rsync-path="sudo rsync" \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            --exclude='error_log' \
            apps/admin/dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${ADMIN_PUBLIC_PATH}/"

      - name: Upload customer frontend
        if: steps.scope.outputs.customer == 'true'
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            --rsync-path="sudo rsync" \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            --exclude='error_log' \
            apps/customer/dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${CUSTOMER_PUBLIC_PATH}/"

      - name: Upload driver frontend
        if: steps.scope.outputs.driver == 'true'
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            --rsync-path="sudo rsync" \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            --exclude='error_log' \
            apps/driver/dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${DRIVER_PUBLIC_PATH}/"

      - name: Finalize frontend ownership
        if: steps.scope.outputs.frontend == 'true'
        shell: bash
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "set -e; \
            DEPLOY_USER='${{ secrets.VPS_USER }}'; \
            DEPLOY_GROUP=\$(id -gn \"\$DEPLOY_USER\"); \
            for path in '${ADMIN_PUBLIC_PATH}' '${CUSTOMER_PUBLIC_PATH}' '${DRIVER_PUBLIC_PATH}'; do \
              if [ -d \"\$path\" ]; then \
                sudo chown -R \"\$DEPLOY_USER:\$DEPLOY_GROUP\" \"\$path\"; \
                sudo find \"\$path\" -type d -exec chmod 755 {} \; ; \
                sudo find \"\$path\" -type f -exec chmod 644 {} \; ; \
              fi; \
            done"

      - name: Finalize Laravel deployment
        if: steps.scope.outputs.backend == 'true'
        shell: bash
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "set -e; \
            cd '${BACKEND_PATH}'; \
            WEBUSER=''; \
            if id www-data >/dev/null 2>&1; then WEBUSER=www-data; fi; \
            if [ -z \"\$WEBUSER\" ]; then WEBUSER=\$(ps -eo user:30,comm,args | awk '/php-fpm|lsphp/ && !/awk/ && \$1 != \"root\" {print \$1; exit}'); fi; \
            if [ -z \"\$WEBUSER\" ] && id aplik7393 >/dev/null 2>&1; then WEBUSER=aplik7393; fi; \
            if [ -z \"\$WEBUSER\" ]; then echo 'Unable to detect web user' >&2; exit 1; fi; \
            WEBGROUP=\$(id -gn \"\$WEBUSER\"); \
            sudo mkdir -p bootstrap/cache storage/app/livewire-tmp storage/app/public/settings/payment storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs /tmp/composer-cache; \
            sudo chown -R \"\$WEBUSER:\$WEBGROUP\" . /tmp/composer-cache; \
            sudo rm -f bootstrap/cache/*.php; \
            sudo -u \"\$WEBUSER\" env COMPOSER_HOME=/tmp/composer-cache composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader; \
            sudo -u \"\$WEBUSER\" php artisan package:discover --ansi; \
            sudo -u \"\$WEBUSER\" php artisan optimize:clear; \
            sudo -u \"\$WEBUSER\" php artisan storage:link || true; \
            sudo -u \"\$WEBUSER\" php artisan migrate --force; \
            sudo -u \"\$WEBUSER\" php artisan db:seed --class=RolePermissionSeeder --force; \
            sudo chown -R \"\$WEBUSER:\$WEBGROUP\" storage bootstrap/cache; \
            sudo find storage bootstrap/cache -type d -exec chmod 775 {} \; ; \
            sudo find storage bootstrap/cache -type f -exec chmod 664 {} \; ; \
            sudo -u \"\$WEBUSER\" php artisan config:cache; \
            sudo -u \"\$WEBUSER\" php artisan route:cache; \
            sudo -u \"\$WEBUSER\" php artisan view:cache; \
            sudo chown -R \"\$WEBUSER:\$WEBGROUP\" storage bootstrap/cache; \
            sudo find storage bootstrap/cache -type d -exec chmod 775 {} \; ; \
            sudo find storage bootstrap/cache -type f -exec chmod 664 {} \; "

      - name: Nothing to deploy
        if: steps.scope.outputs.any != 'true'
        run: echo "No frontend or backend deployment needed for this change."
